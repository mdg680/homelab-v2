---
- name: Setup K3s master nodes
  hosts: k3s_servers
  become: true
  vars_files:
    - ../inventory/group_vars/homelab_vault.yml
  tasks:
    - name: Install K3s
      ansible.builtin.shell: |
        set -o pipefail
        curl -sfL https://get.k3s.io | INSTALL_K3S_VERSION={{ k3s_version }} sh -
      args:
        creates: /usr/local/bin/k3s

    - name: Wait for K3s to be ready
      ansible.builtin.wait_for:
        port: 6443
        delay: 5
        timeout: 300
    - name: Check K3s cluster status
      ansible.builtin.shell: /usr/local/bin/k3s kubectl get nodes
      register: k3s_nodes
      changed_when: false

    - name: Display K3s cluster nodes
      ansible.builtin.debug:
        msg: "{{ k3s_nodes.stdout }}"