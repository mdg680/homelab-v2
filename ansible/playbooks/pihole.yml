---
- name: Configure Pi-hole DNS records
  hosts: localhost
  connection: local
  vars_files:
    - ../inventory/group_vars/homelab_vault.yml
  vars:
    traefik_ip: "{{ vault_loadbalancer_ip }}"
    custom_domains:
      - whoami.home
      - jellyfin.home
      - pihole.home
      - argocd.home
  tasks:
    - name: Add custom DNS records to Pi-hole
      kubernetes.core.k8s_exec:
        namespace: pihole
        pod: "{{ lookup('kubernetes.core.k8s', kind='Pod', namespace='pihole', label_selector='app=pihole').metadata.name }}"
        command: >
          sh -c "mkdir -p /etc/pihole/hosts &&
                 {% for domain in custom_domains %}echo '{{ traefik_ip }} {{ domain }}' >> /etc/pihole/hosts/custom.hosts &&
                 {% endfor %}echo 'addn-hosts=/etc/pihole/hosts/custom.hosts' > /etc/dnsmasq.d/99-custom-hosts.conf &&
                 pihole reloaddns"
